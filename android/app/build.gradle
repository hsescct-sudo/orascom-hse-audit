plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orascom.hseaudit'
    compileSdk 34

    defaultConfig {
        applicationId 'com.orascom.hseaudit'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed after the build with the HSE Audit key (kept outside the repository).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
