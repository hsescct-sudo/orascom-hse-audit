# Builds the HSE Audit Android app (android/) and checks it on an emulator.
# The unsigned release APK, the debug APK, the build log and the emulator
# screenshots are pushed to the "apk-build" branch. The release APK is signed
# afterwards with the HSE Audit key, which is never stored in this repository.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release and debug APKs
        id: build
        run: |
          set -o pipefail
          gradle -p android assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Enable KVM for the emulator
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an Android emulator
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/smoke.sh

      - name: Push the results to the apk-build branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp -r shots out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/commit.txt
          echo "build=${{ steps.build.outcome }}" > out/status.txt
          cd out
          git init -q
          git checkout -q -b apk-build
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Android build for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build
